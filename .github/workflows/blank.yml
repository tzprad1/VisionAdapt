name: Build VisionAdapt APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Abrir projeto VisionAdapt
        run: unzip -o VisionAdapt_SourceForCI.zip

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionAdapt-APK
          path: app/build/outputs/apk/debug/app-debug.apk
